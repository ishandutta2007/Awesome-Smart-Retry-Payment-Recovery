<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0f1d; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.3;0.05;0.3" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Animated Circuit & Ambient Grid Lines in Deep Background -->
  <g opacity="0.18">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#38bdf8" stroke-dasharray="6,6" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#38bdf8" stroke-dasharray="4,8" />
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#38bdf8" stroke-dasharray="6,6" />
    <line x1="300" y1="0" x2="300" y2="360" stroke="#818cf8" stroke-dasharray="4,8" />
    <line x1="600" y1="0" x2="600" y2="360" stroke="#818cf8" stroke-dasharray="4,8" />
    <line x1="900" y1="0" x2="900" y2="360" stroke="#818cf8" stroke-dasharray="4,8" />
  </g>

  <!-- Flowing Dynamic Light Pulse across Bottom Arc -->
  <path d="M 0,310 Q 300,280 600,310 T 1200,300" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" />
  <circle r="4" fill="#38bdf8" filter="url(#softGlow)">
    <animateMotion path="M 0,310 Q 300,280 600,310 T 1200,300" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#34d399" filter="url(#softGlow)">
    <animateMotion path="M 0,310 Q 300,280 600,310 T 1200,300" dur="8s" repeatCount="indefinite" begin="2s" />
  </circle>

  <!-- Ambient Glowing Orbs (Soft Depth) -->
  <circle cx="980" cy="120" r="140" fill="url(#glowPulse)" filter="url(#softGlow)" />
  <circle cx="120" cy="240" r="100" fill="url(#glowPulse)" filter="url(#softGlow)" />

  <!-- DYNAMIC RIGHT-HAND VISUALIZATION: Intelligent Recovery Pipeline -->
  <g transform="translate(730, 45)" filter="url(#dropShadow)">
    <!-- Stage 1 Card: Decline Detected -->
    <g transform="translate(0, 0)">
      <rect width="180" height="54" rx="10" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="25" cy="27" r="7" fill="#ef4444" opacity="0.8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="44" y="24" fill="#f87171" font-size="11" font-weight="700" letter-spacing="0.5">PAYMENT DECLINED</text>
      <text x="44" y="40" fill="#94a3b8" font-size="10">Code 05: Do Not Honor</text>
    </g>

    <!-- Connector 1 -> 2 with Animated Flow Pulse -->
    <line x1="90" y1="54" x2="90" y2="88" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />
    <circle cx="90" cy="71" r="3" fill="#38bdf8">
      <animate attributeName="cy" values="55;87;55" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <!-- Stage 2 Card: Smart ML Retry Optimization -->
    <g transform="translate(0, 88)">
      <rect width="180" height="58" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.4" />
      <!-- Pulsing gear / ML node icon -->
      <circle cx="25" cy="29" r="8" fill="#818cf8" opacity="0.3">
        <animate attributeName="r" values="7;11;7" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="25" cy="29" r="4" fill="#a5b4fc" />
      <text x="44" y="24" fill="#c7d2fe" font-size="11" font-weight="700" letter-spacing="0.5">SMART RETRY ML</text>
      <text x="44" y="40" fill="#38bdf8" font-size="10" font-weight="600">Optimal Window: +42h</text>
      <text x="44" y="51" fill="#64748b" font-size="9">Issuer timezone &amp; payday</text>
    </g>

    <!-- Connector 2 -> 3 with Animated Flow Pulse -->
    <line x1="90" y1="146" x2="90" y2="180" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />
    <circle cx="90" cy="163" r="3" fill="#34d399">
      <animate attributeName="cy" values="147;179;147" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <!-- Stage 3 Card: Recovered Revenue -->
    <g transform="translate(0, 180)">
      <rect width="180" height="54" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.4" />
      <circle cx="25" cy="27" r="7" fill="#10b981" opacity="0.9">
        <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="44" y="23" fill="#34d399" font-size="11" font-weight="700" letter-spacing="0.5">REVENUE RECOVERED</text>
      <text x="44" y="39" fill="#e2e8f0" font-size="11" font-weight="600">+100% ARR Salvaged</text>
    </g>

    <!-- Floating Live Metric Badge -->
    <g transform="translate(198, 98)">
      <rect width="170" height="64" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" fill="#94a3b8" font-size="10" font-weight="600">AVG RECOVERY LIFT</text>
      <text x="14" y="47" fill="#38bdf8" font-size="22" font-weight="800">+55%–70%</text>
      <circle cx="145" cy="22" r="5" fill="#34d399">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- FOREGROUND HERO CONTENT: Guaranteed Crisp & High Contrast (Never hidden) -->
  <g transform="translate(60, 52)">
    <!-- Category Pill Badge -->
    <g>
      <rect width="270" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle cx="16" cy="14" r="4" fill="#34d399" />
      <text x="28" y="18" fill="#e2e8f0" font-size="11" font-weight="600" letter-spacing="0.6">SUBSCRIPTION REVENUE OPS &amp; FINTECH</text>
    </g>

    <!-- Main Title (Highest Contrast Foreground) -->
    <text x="0" y="80" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">
      Awesome Smart Retry &amp;
    </text>
    <text x="0" y="122" fill="url(#accentGrad)" font-size="34" font-weight="800" letter-spacing="-0.5">
      Payment Recovery
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="162" fill="#cbd5e1" font-size="14.5" font-weight="400">
      Curated directory of top commercial SaaS &amp; open-source platforms
    </text>
    <text x="0" y="184" fill="#94a3b8" font-size="13.5" font-weight="400">
      Eliminating involuntary churn, smart retries &amp; automated dunning logic.
    </text>

    <!-- Interactive / Feature Badges in Foreground -->
    <g transform="translate(0, 218)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="138" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="17" fill="#38bdf8" font-size="11" font-weight="600">⚡ Machine Learning</text>

      <!-- Badge 2 -->
      <rect x="146" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="158" y="17" fill="#a5b4fc" font-size="11" font-weight="600">🛡️ Dunning Ops</text>

      <!-- Badge 3 -->
      <rect x="284" y="0" width="138" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="296" y="17" fill="#34d399" font-size="11" font-weight="600">🔄 Involuntary Churn</text>
    </g>
  </g>
</svg>
